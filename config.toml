# Padel court watcher settings. No secrets in here - those go in .env.

[club]
name = "Padel Amigos Hamburg-Halstenbek"
# The club's page on playtomic.com, e.g. https://playtomic.com/clubs/<club-name>.
# Filled in by START-HERE.bat (or: py -m padel_bot set-club <link>).
url = ""
# Link put in every alert. {club_url}, {tenant_id} and {date} (YYYY-MM-DD) are
# filled in. Default: the club page opened on the slot's day.
booking_url = "{club_url}?date={date}"
# Are the API's slot times in "utc" or "local" (Hamburg) time? Sources disagree.
# If `check --all` shows times 1-2 hours off from the app, switch this.
api_times = "utc"

[courts]
indoor_only = true
size = "double"         # "double" = the 4 indoor doubles courts; "single" or "any"
exclude_names = []      # e.g. ["Court 4"] to ignore a court by name

[watch]
# Courts open 14 days ahead (today 25 Oct -> bookable until 8 Nov), so watch
# today plus the next 14 days.
days_ahead = 14
# The club lets you cancel for free up to this many hours before a game.
# Alerts for games starting sooner get a warning; "I booked it" reminds you
# 48h before a game, i.e. 24h before free cancellation ends.
free_cancellation_hours = 24
# Skip alerts for games starting sooner than this (hours). 0 = alert for all.
min_notice_hours = 0

# A slot matches when the whole game fits inside a window:
# weekday 16:00-20:30 with 90 min => starts 16:00, 16:30, ... 19:00.
[[watch.window]]
days = ["mon", "tue", "wed", "thu", "fri"]
start = "16:00"
end = "20:30"
duration_minutes = 90
preferred_starts = ["16:30", "17:00"]   # marked with a star and listed first

# Weekend 09:30-12:30 with 90 min => starts 09:30, 10:00, 10:30, 11:00.
[[watch.window]]
days = ["sat", "sun"]
start = "09:30"
end = "12:30"
duration_minutes = 90

[polling]
# Gentle by design: roughly 90 requests per hour in total.
near_days = 4                 # today + next 3 days: checked every near_interval
near_interval_minutes = 5
far_interval_minutes = 20     # days 4-13
newest_day_fast = true        # day 14 (just opened for booking) uses near_interval too
jitter_seconds = 60           # random +/- so requests don't look clockwork
pause_between_requests_seconds = [2, 4]
quiet_hours = ["23:00", "07:00"]   # no checks at night; set to [] to disable
user_agent = "padel-court-bot/1.0 (personal availability watcher)"

[notify]
only_preferred = false        # true = only alert for 16:30 / 17:00 on weekdays
alert_after_failed_rounds = 6 # warn you on Telegram if checks keep failing
telegram_commands = true      # change wishes from Telegram: send /help to the bot
daily_report = "08:00"        # daily "still watching" message; "off" to disable

[booking]
# Booking needs your Playtomic login (/login) and pays from your account.
# Turned on step by step from Telegram: 🧪 test -> 💳 one booking with a tap
# -> 🤖 automatic (Settings). Nothing is booked before you start that.
max_price_eur = 70            # never book a court that costs more (whole court)
players = 4
split_payment = true          # others pay their share in Playtomic
payment_methods = ["MERCHANT_WALLET", "CREDIT_CARD"]   # club wallet first, then card
auto_min_hours = 24           # automatic bookings only if still cancellable for free
max_per_day = 1               # at most this many bot bookings per day of play
max_per_week = 0              # 0 = no weekly limit

[events]
# Club events, matched by name: group classes (public) and Open Play events
# (these need your Playtomic login: double-click playtomic-login.bat).
# Change the names from Telegram with /watch and /unwatch.
enabled = true
watch = ["Newcomer", "Afterwork"]
check_every_minutes = 30      # new dates appear at random times; minimum 15
days_ahead = 120              # how far ahead to look for published dates
weekly_overview = "sun 18:00" # or "off"
api_times = "utc"
