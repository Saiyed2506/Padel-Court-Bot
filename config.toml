# Padel court watcher settings. No secrets in here - those go in .env.

[club]
name = "Padel Amigos Hamburg-Halstenbek"
# Fill in after running:  py -m padel_bot find-club
tenant_id = ""
# Link put in every alert. {tenant_id} and {date} (YYYY-MM-DD) are filled in.
# Playtomic has no documented link to one exact slot. Test this with
# `py -m padel_bot test-notify`; if it doesn't open your club, replace it with
# the club's URL copied from your browser on playtomic.com.
booking_url = "https://app.playtomic.io/tenant/{tenant_id}"

[courts]
indoor_only = true
size = "double"         # "double" = the 4 indoor doubles courts; "single" or "any"
exclude_names = []      # e.g. ["Court 4"] to ignore a court by name

[watch]
# Courts open 14 days ahead (today 25 Oct -> bookable until 8 Nov), so watch
# today plus the next 14 days.
days_ahead = 14

# A slot matches when the whole game fits inside a window:
# weekday 16:00-20:00 with 90 min => starts 16:00, 16:30, ... 18:30.
[[watch.window]]
days = ["mon", "tue", "wed", "thu", "fri"]
start = "16:00"
end = "20:00"
duration_minutes = 90
preferred_starts = ["16:30", "17:00"]   # marked with a star and listed first

# Weekend 09:30-12:30 with 90 min => starts 09:30, 10:00, 10:30, 11:00.
[[watch.window]]
days = ["sat", "sun"]
start = "09:30"
end = "12:30"
duration_minutes = 90

[polling]
# Gentle by design: roughly 90 requests per hour in total.
near_days = 4                 # today + next 3 days: checked every near_interval
near_interval_minutes = 5
far_interval_minutes = 20     # days 4-13
newest_day_fast = true        # day 14 (just opened for booking) uses near_interval too
jitter_seconds = 60           # random +/- so requests don't look clockwork
pause_between_requests_seconds = [2, 4]
quiet_hours = ["23:00", "07:00"]   # no checks at night; set to [] to disable
user_agent = "padel-court-bot/1.0 (personal availability watcher)"

[notify]
only_preferred = false        # true = only alert for 16:30 / 17:00 on weekdays
alert_after_failed_rounds = 6 # warn you on Telegram if checks keep failing

[auto_book]
# Not implemented yet. Even when enabled, only dry-run (log only) is allowed.
enabled = false
dry_run = true
max_price_eur = 0             # must be > 0 before enabled can be true
